# docker compose up -d
# Then open http://<this machine>:5000/#/admin
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wifi_billing
      POSTGRES_USER: wifi
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wifi -d wifi_billing"]
      interval: 5s
      retries: 20

  app:
    build:
      context: .
      # build with the host's network, avoids DNS/timeouts inside VMs
      network: host
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://wifi:${DB_PASSWORD:-change-me}@db:5432/wifi_billing
    ports:
      - "5000:5000/tcp"
      - "1812:1812/udp"
      - "1813:1813/udp"

  # Optional: this machine becomes the customers' gateway (for routers without a
  # hotspot, e.g. Tenda). Start with: docker compose --profile gateway up -d
  # Turn DHCP off on your router first, see "Built-in gateway" in the README.
  gateway:
    profiles: ["gateway"]
    build:
      context: .
      dockerfile: gateway/Dockerfile
      network: host
    restart: unless-stopped
    depends_on:
      - app
    network_mode: host
    privileged: true
    env_file:
      - backend/.env
    volumes:
      - gateway-data:/data

volumes:
  pgdata:
  gateway-data:
