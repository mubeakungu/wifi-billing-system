# Render Blueprint: backend API, static frontend, PostgreSQL and an expiry job.
# After the first deploy, set the M-Pesa secrets in the Render dashboard.
services:
  - type: web
    name: wifi-billing-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # init_db.py is idempotent: creates tables and the first admin (ADMIN_PASSWORD)
    preDeployCommand: python init_db.py
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT billing_system_backend:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: wifi_billing_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: BUSINESS_NAME
        sync: false
      - key: SUPPORT_CONTACT
        sync: false
      - key: PORTAL_URL
        value: https://wifi-billing-frontend.onrender.com
      - key: PUBLIC_API_URL
        value: https://wifi-billing-backend.onrender.com/api
      # Render has no UDP, so RADIUS can't run here: MikroTik routers use pull sync.
      # For other brands, run the Docker setup on a VPS or a PC in your network.
      - key: ROUTER_MODE
        value: pull
      - key: RADIUS_ENABLED
        value: "0"
      - key: CORS_ORIGINS
        value: https://wifi-billing-frontend.onrender.com
      - key: MPESA_ENV
        value: sandbox
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        value: "174379"
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        value: https://wifi-billing-backend.onrender.com/api/mpesa/callback
      - key: MPESA_CALLBACK_TOKEN
        generateValue: true
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false

  - type: web
    name: wifi-billing-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://wifi-billing-backend.onrender.com/api

  - type: cron
    name: expire-vouchers
    runtime: python
    plan: starter
    rootDir: backend
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "from billing_system_backend import expire_vouchers; expire_vouchers()"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wifi_billing_db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: wifi-billing-backend
          envVarKey: SECRET_KEY
      - key: FLASK_ENV
        value: production

databases:
  - name: wifi_billing_db
    databaseName: wifi_billing
    plan: basic-256mb
    ipAllowList: []
