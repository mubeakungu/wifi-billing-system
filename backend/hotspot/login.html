<!DOCTYPE html>
<!--
  MikroTik hotspot login page for the WiFi billing system.
  Download the filled-in copy from the dashboard (Router tab), then upload it to
  the router as hotspot/login.html (Winbox > Files, or drag and drop).
  The router fills in its own variables (link-login-only, chap-id, error, ...).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <title>{{BUSINESS_NAME}} - WiFi Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 16px; background: #0F172A; color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      width: 100%; max-width: 380px; background: #1E293B; border: 1px solid #334155;
      border-radius: 16px; padding: 28px 24px; text-align: center;
    }
    h1 { font-size: 22px; color: #F8FAFC; margin-bottom: 6px; }
    .sub { color: #94A3B8; font-size: 14px; margin-bottom: 20px; }
    input {
      width: 100%; padding: 14px; font-size: 20px; letter-spacing: 0.15em; text-align: center;
      text-transform: uppercase; background: #0F172A; color: #F8FAFC;
      border: 2px solid #334155; border-radius: 10px; outline: none;
    }
    input:focus { border-color: #3B82F6; }
    button, .buy {
      display: block; width: 100%; margin-top: 12px; padding: 13px; border: none; border-radius: 10px;
      font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none;
    }
    button { background: #3B82F6; color: #FFF; }
    button:disabled { opacity: 0.6; }
    .buy { background: #10B981; color: #FFF; }
    .or { margin: 18px 0 6px; color: #64748B; font-size: 13px; }
    .error {
      background: rgba(239, 68, 68, 0.12); border: 1px solid #EF4444; color: #FCA5A5;
      padding: 10px; border-radius: 8px; font-size: 14px; margin-bottom: 14px;
    }
    .help { margin-top: 18px; color: #64748B; font-size: 12px; }
  </style>
</head>
<body>
  $(if chap-id)
  <form name="sendin" action="$(link-login-only)" method="post" style="display:none">
    <input type="hidden" name="username" />
    <input type="hidden" name="password" />
    <input type="hidden" name="dst" value="$(link-orig)" />
    <input type="hidden" name="popup" value="true" />
  </form>
  <script src="/md5.js"></script>
  $(endif)

  <div class="card">
    <h1>{{BUSINESS_NAME}}</h1>
    <p class="sub">Enter your voucher code to connect</p>

    $(if error)<div class="error">$(error)</div>$(endif)
    <div class="error" id="msg" style="display:none"></div>

    <form name="login" action="$(link-login-only)" method="post" onsubmit="return doLogin()">
      <input type="hidden" name="username" />
      <input type="hidden" name="password" />
      <input type="hidden" name="dst" value="$(link-orig)" />
      <input type="hidden" name="popup" value="true" />
      <input id="code" type="text" placeholder="VOUCHER CODE" autocomplete="off"
             autocapitalize="characters" spellcheck="false" autofocus />
      <button type="submit" id="go">Connect</button>
    </form>

    <p class="or">No voucher yet?</p>
    <a class="buy" href="{{PORTAL_URL}}">Buy one with M-Pesa</a>

    <p class="help">Just paid? Your code can take up to a minute to work. {{SUPPORT_CONTACT}}</p>
  </div>

  <script>
    var API_URL = '{{API_URL}}';

    function submitToRouter(code) {
      $(if chap-id)
      document.sendin.username.value = code;
      document.sendin.password.value = hexMD5('$(chap-id)' + code + '$(chap-challenge)');
      document.sendin.submit();
      $(else)
      document.login.username.value = code;
      document.login.password.value = code;
      document.login.submit();
      $(endif)
    }

    function showMessage(text) {
      var box = document.getElementById('msg');
      box.innerText = text;
      box.style.display = 'block';
      document.getElementById('go').disabled = false;
    }

    function doLogin() {
      var code = document.getElementById('code').value.replace(/\s+/g, '').toUpperCase();
      if (!code) return false;
      document.getElementById('go').disabled = true;

      // Ask the billing system first: starts unused codes and catches expired ones.
      // If it can't be reached, log in anyway and let the router decide.
      var done = false;
      var proceed = function () { if (!done) { done = true; submitToRouter(code); } };
      setTimeout(proceed, 4000);
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', API_URL + '/vouchers/validate', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.onreadystatechange = function () {
          if (xhr.readyState !== 4 || done) return;
          // 404 = not a billing-system code (e.g. an older router user): let the router decide
          if (xhr.status === 410) {
            done = true;
            showMessage('That voucher has expired. Buy a new one below.');
          } else {
            proceed();
          }
        };
        xhr.send(JSON.stringify({ code: code }));
      } catch (e) {
        proceed();
      }
      return false;
    }
  </script>
</body>
</html>
