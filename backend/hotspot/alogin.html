<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="2; url=$(link-redirect)">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <title>Connected</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0F172A; color: #E2E8F0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px; }
    .card { max-width: 380px; width: 100%; background: #1E293B; border: 1px solid #334155; border-radius: 16px;
      padding: 28px 24px; text-align: center; }
    h1 { font-size: 22px; margin: 0 0 8px; color: #F8FAFC; }
    a { display: block; margin-top: 16px; padding: 13px; border-radius: 10px; background: #10B981; color: #fff;
      text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're connected</h1>
    <p>Enjoy your browsing.</p>
    <a href="$(link-redirect)">Continue</a>
  </div>
</body>
</html>
